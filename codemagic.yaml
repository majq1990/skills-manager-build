# macOS builds run on Codemagic when a v* tag is pushed. Artifacts stay in
# Codemagic Cloud; uploading them to demo is handled from the local release host
# because direct Codemagic-to-demo transfer is too slow.
workflows:
  macos-build:
    name: skills-manager macOS build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      vars:
        BUNDLE_TARGETS: "app,dmg"
      groups:
        - demo_release
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Show toolchain
        script: |
          set -euxo pipefail
          node -v
          npm -v

      - name: Install Rust and targets
        script: |
          set -euxo pipefail
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version

      - name: Install npm dependencies
        script: |
          set -euxo pipefail
          npm ci

      - name: Build aarch64
        script: |
          set -euxo pipefail
          source "$HOME/.cargo/env"
          export TAURI_SIGNING_PRIVATE_KEY=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Build x86_64
        script: |
          set -euxo pipefail
          source "$HOME/.cargo/env"
          export TAURI_SIGNING_PRIVATE_KEY=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')
          npx tauri build --target x86_64-apple-darwin --bundles app,dmg

      - name: Collect artifacts
        script: |
          set -euxo pipefail
          mkdir -p out
          VERSION=$(node -p "require('./package.json').version")
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg "out/skills-manager_${VERSION}_aarch64.dmg"
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz "out/skills-manager_${VERSION}_aarch64.app.tar.gz"
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig "out/skills-manager_${VERSION}_aarch64.app.tar.gz.sig"
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg "out/skills-manager_${VERSION}_x86_64.dmg"
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz "out/skills-manager_${VERSION}_x86_64.app.tar.gz"
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig "out/skills-manager_${VERSION}_x86_64.app.tar.gz.sig"
          ls -la out/

    artifacts:
      - out/*.dmg
      - out/*.app.tar.gz
      - out/*.app.tar.gz.sig

    publishing:
      email:
        recipients:
          - phneixfh@gmail.com
        notify:
          success: true
          failure: true
