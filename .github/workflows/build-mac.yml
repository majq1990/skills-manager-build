name: Build macOS

on:
  workflow_dispatch:
    inputs:
      bundles:
        description: "Bundles to build (comma separated: app,dmg or all)"
        required: false
        default: "app,dmg"
  # macOS tag builds are handled by Codemagic; keep this workflow manual as a fallback.

jobs:
  build-macos:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
          # Cross-compile Intel binary on arm64 runner (macos-13 queue too long)
          - os: macos-14
            target: x86_64-apple-darwin
            name: macos-x64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install npm deps
        run: npm ci

      - name: Build (Tauri)
        env:
          # GitHub Secrets can introduce soft line wraps when pasted via the web
          # UI; strip all whitespace so base64 decoding succeeds.
          TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          export TAURI_SIGNING_PRIVATE_KEY=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_RAW" | tr -d '[:space:]')
          echo "key length (sanitized): ${#TAURI_SIGNING_PRIVATE_KEY}"
          npx tauri build --target ${{ matrix.target }} --bundles ${{ github.event.inputs.bundles || 'app,dmg' }}

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp -r src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg out/ 2>/dev/null || true
          cp -r src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app out/ 2>/dev/null || true
          # Tauri v2 updater artifacts: *.app.tar.gz + .sig
          cp -r src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz* out/ 2>/dev/null || true
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skills-manager-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 14
