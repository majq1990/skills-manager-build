<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skills Manager - 下载</title>
  <style>
    :root {
      --bg: #0c0c0d;
      --card: #161618;
      --border: #2a2a2d;
      --text: #e4e4e7;
      --muted: #8b8b8b;
      --accent: #6366f1;
      --hover: #1f1f22;
      --green: #22c55e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
    header { text-align: center; padding: 60px 20px 40px; }
    header h1 { font-size: 2rem; font-weight: 700; }
    header p { color: var(--muted); margin-top: 8px; font-size: 0.95rem; }
    .container { max-width: 960px; margin: 0 auto; padding: 0 20px 60px; }
    .platform-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent); }
    .card h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
    .card .arch { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
    .dl-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .dl-list li a {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: var(--hover); border-radius: 8px;
      color: var(--text); text-decoration: none; font-size: 0.9rem;
      border: 1px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }
    .dl-list li a:hover { border-color: var(--accent); background: #252529; }
    .dl-list .ext { color: var(--muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
    .dl-list .size { color: var(--muted); font-size: 0.75rem; margin-left: 8px; }
    .version-badge { display: inline-flex; align-items: center; gap: 6px; background: #1a3322; color: var(--green); font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; margin-left: 8px; }
    .footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.8rem; border-top: 1px solid var(--border); margin-top: 40px; }
    .spinner { display: none; text-align: center; padding: 40px; color: var(--muted); }
    .loading .spinner { display: block; }
    .loading .platform-grid { display: none; }
  </style>
</head>
<body>
<header>
  <h1>Skills Manager <span id="ver"></span></h1>
  <p>企业 Skill 管理与分发桌面工具 — 选择你的平台下载</p>
</header>
<div class="container loading" id="app">
  <div class="spinner">加载中...</div>
  <div class="platform-grid" id="grid"></div>
</div>
<footer class="footer">Skills Manager &copy; 2026 · 仅限企业内部使用</footer>

<script>
(async () => {
  const BASE = 'https://demo.egova.com.cn/MediaRoot/skill-manager';

  const FALLBACK = {
    'linux-x86_64': {
      label: 'Linux', arch: 'x86_64',
      items: [
        { label: '.deb', ext: 'deb', url: '' },
        { label: '.rpm', ext: 'rpm', url: '' },
        { label: 'AppImage', ext: 'AppImage', url: '' },
      ]
    }
  };

  let data;
  try {
    const res = await fetch(BASE + '/latest.json');
    data = await res.json();
  } catch (e) {
    data = null;
  }

  const app = document.getElementById('app');
  if (!data) {
    app.className = 'container';
    document.getElementById('grid').innerHTML = '<p style="text-align:center;color:var(--muted)">无法获取版本信息，请稍后刷新。</p>';
    return;
  }

  document.getElementById('ver').innerHTML =
    '<span class="version-badge">v' + data.version + '</span>';

  const platforms = data.platforms || {};

  const cfg = {
    'windows-x86_64': {
      label: 'Windows', arch: 'x64',
      items: [
        { label: '安装程序 (.exe)', ext: 'exe', key: 'windows-x86_64' },
        { label: 'MSI 安装包', ext: 'msi', key: 'windows-x86_64-msi' },
      ]
    },
    'windows-x86_64-msi': { hidden: true },
    'darwin-x86_64': {
      label: 'macOS', arch: 'Intel (x64)',
      items: [
        { label: 'DMG 镜像', ext: 'dmg', key: 'darwin-x86_64' },
        { label: '.app.tar.gz', ext: 'tar.gz', key: 'darwin-x86_64' },
      ]
    },
    'darwin-aarch64': {
      label: 'macOS', arch: 'Apple Silicon (ARM)',
      items: [
        { label: 'DMG 镜像', ext: 'dmg', key: 'darwin-aarch64' },
        { label: '.app.tar.gz', ext: 'tar.gz', key: 'darwin-aarch64' },
      ]
    },
  };

  const cards = [];

  for (const [key, info] of Object.entries(cfg)) {
    if (info.hidden) continue;
    const items = [];
    for (const it of info.items) {
      const plat = platforms[it.key];
      if (plat && plat.url) {
        items.push(plat);
      } else if (it.key === 'windows-x86_64-msi') {
        const exeUrl = platforms['windows-x86_64']?.url || '';
        const msiUrl = exeUrl.replace('x64-setup.exe', 'x64_en-US.msi');
        items.push({ url: msiUrl, label: it.label, ext: it.ext });
      }
    }
    cards.push({ key, info, items });
  }

  // check if we have linux entries in latest.json; if not, fallback
  const hasLinux = platforms['linux-x86_64'];

  let html = '';
  for (const card of cards) {
    html += '<div class="card"><h3>' + card.info.label + '</h3>';
    html += '<div class="arch">' + card.info.arch + '</div><ul class="dl-list">';
    for (const it of card.items) {
      const ext = it.ext || '';
      html += '<li><a href="' + it.url + '" download>' + (it.label || ext.toUpperCase()) + '<span class="ext">' + ext.toUpperCase() + '</span></a></li>';
    }
    html += '</ul></div>';
  }

  if (!hasLinux) {
    const l = FALLBACK['linux-x86_64'];
    html += '<div class="card"><h3>' + l.label + '</h3>';
    html += '<div class="arch">' + l.arch + ' (待发布)</div><ul class="dl-list">';
    for (const it of l.items) {
      html += '<li><a class="soon" style="opacity:0.4;cursor:not-allowed">' + it.label + '<span class="ext">' + it.ext.toUpperCase() + '</span></a></li>';
    }
    html += '</ul></div>';
  }

  document.getElementById('grid').innerHTML = html;
  app.className = 'container';
})();
</script>
</body>
</html>
